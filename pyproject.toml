[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "degradomap"
version = "0.5.0"
description = "Empirical evaluation of public-data features for predicting PROTAC E3 ligase tractability"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Abraham Trueba"}]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "biopython>=1.81",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.scripts]
degradomap = "degradomap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
